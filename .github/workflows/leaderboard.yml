name: Leaderboard

# A push to main replays every run, leaves out those that do not match their scores, and publishes
# public/leaderboard.json with the site.
on:
  push:
    branches: [main]
    paths: ["leaderboard/**"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay every run
        run: |
          shopt -s nullglob
          KEEP_GOING=1 scripts/replay-runs.sh "$RUNNER_TEMP/verified" leaderboard/*.run.json
          npx tsx scripts/leaderboard.ts "$RUNNER_TEMP"/verified/*.json
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update leaderboard"
          git push
          # A push made with the workflow token starts no workflow, so the deploy is started by hand.
          gh workflow run pages.yml --ref main
