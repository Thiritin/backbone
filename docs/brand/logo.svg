<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C74F2"/>
      <stop offset="1" stop-color="#2546C4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EBF5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0A1A5C" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- B: the stem is a rack rail, the bowls are two server units -->
  <g filter="url(#sh)">
    <path fill="url(#face)" d="
      M156 100 H316 a52 52 0 0 1 52 52 V190 C368 230 346 250 312 256
      C352 262 376 284 376 312 V356 a56 56 0 0 1 -56 56 H156
      a16 16 0 0 1 -16 -16 V116 a16 16 0 0 1 16 -16 Z"/>
  </g>

  <!-- rail holes -->
  <g fill="#2546C4" opacity="0.9">
    <rect x="160" y="126" width="18" height="12" rx="3"/>
    <rect x="160" y="166" width="18" height="12" rx="3"/>
    <rect x="160" y="206" width="18" height="12" rx="3"/>
    <rect x="160" y="294" width="18" height="12" rx="3"/>
    <rect x="160" y="334" width="18" height="12" rx="3"/>
    <rect x="160" y="374" width="18" height="12" rx="3"/>
  </g>

  <!-- seam between the two units -->
  <rect x="196" y="252" width="110" height="8" rx="4" fill="#2546C4" opacity="0.18"/>

  <!-- top unit: drive bays and LEDs -->
  <g fill="#1A2238">
    <rect x="212" y="134" width="96" height="16" rx="8"/>
    <rect x="212" y="162" width="96" height="16" rx="8"/>
    <rect x="212" y="190" width="96" height="16" rx="8"/>
  </g>
  <circle cx="334" cy="142" r="9" fill="#2FBF71"/>
  <circle cx="334" cy="170" r="9" fill="#2FBF71"/>

  <!-- bottom unit -->
  <g fill="#1A2238">
    <rect x="212" y="292" width="114" height="16" rx="8"/>
    <rect x="212" y="320" width="114" height="16" rx="8"/>
    <rect x="212" y="348" width="114" height="16" rx="8"/>
  </g>
  <circle cx="352" cy="300" r="9" fill="#2FBF71"/>
  <circle cx="352" cy="328" r="9" fill="#F2B33D"/>
</svg>
