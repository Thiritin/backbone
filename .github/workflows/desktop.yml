name: Desktop

# Builds the installers for a release and attaches them with the updater manifest (latest.json). release.yml calls it
# for the release it runs on; run it by hand to rebuild the installers of an existing release:
# gh workflow run desktop.yml -f tag=vX.Y.Z
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true

concurrency:
  group: desktop
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin", rust-targets: "aarch64-apple-darwin" }
          - { os: windows-latest, args: "", rust-targets: "" }
          - { os: ubuntu-22.04, args: "", rust-targets: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # The app version is the tag without its v (v1.2.3 becomes 1.2.3). The committed files keep their own version.
      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1].slice(1);
            const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            c.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(c, null, 2));
            const t = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", t);
          ' "${{ inputs.tag }}"
      # The updater manifest carries the release body as the notes shown in the update sheet.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            gh release view "${{ inputs.tag }}" --json body --jq .body
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
