<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backbone mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
  .idx-win { left: 50%; top: 50%; translate: -50% -55%; width: 620px; }
  .idx { display: grid; gap: 2px; padding: 10px; }
  .idx a { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; }
  .idx a:hover { background: var(--hover); }
  .idx .tile { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: white; }
  .idx .tile svg.lucide { width: 18px; height: 18px; }
  .idx strong { display: block; font-weight: 600; }
  .idx span { color: var(--text-2); }
  .idx .dark { font-size: 12px; color: var(--accent-text); text-decoration: none; padding: 4px 8px; border-radius: 6px; }
  .idx .dark:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<div class="desktop">
  <section class="window front idx-win" aria-label="Mockups">
    <div class="titlebar">
      <div class="lights"><span></span><span></span><span></span></div>
      <h1>Backbone <span class="sub">Layout mockups</span></h1>
    </div>
    <nav class="idx" id="idx"></nav>
  </section>
</div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="shell.js"></script>
<script>
  const pages = [
    ["desktop.html", "Locations", "Desktop", "Shows the menu bar, the dock, the Locations map, Finance and notification banners."],
    ["support.html", "Support", "Support inbox", "Shows the ticket queue during the fra1-vps-04 outage with a reply open."],
    ["rack.html", "Locations", "Rack view", "Shows rack A07 with brand server fronts, the switch inspector, port groups and the technician PC."],
    ["plans.html", "Products", "Plans editor", "Shows the VPS plans while one price is changed against cluster capacity."],
  ];
  const icon = (app) => APPS.find((a) => a.name === app).icon;
  document.getElementById("idx").innerHTML = pages.map(([href, app, title, text]) => `
    <div style="display:grid;grid-template-columns:1fr auto;align-items:center">
      <a href="${href}"><span class="tile" style="background:${appTile(app)}"><i data-lucide="${icon(app)}"></i></span><span><strong>${title}</strong><span>${text}</span></span></a>
      <a class="dark" href="${href}?theme=dark">Dark</a>
    </div>`).join("");
  mountShell({ app: "Finder", running: [], badges: {} });
</script>
</body>
</html>
