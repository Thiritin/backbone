name: Release

# Run by hand. Tags the date as the version (2026.10.31, then 2026.10.31.2), publishes a GitHub release with the
# CHANGELOG.md bullets added since the last release, and posts the same notes to the #changelog channel.
on: workflow_dispatch

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          base=$(date -u +%Y.%m.%d)
          v=$base
          n=1
          while git rev-parse -q --verify "refs/tags/$v" >/dev/null; do
            n=$((n + 1)); v="$base.$n"
          done
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: node scripts/discord-changelog.mjs --since "${{ steps.v.outputs.prev }}" --version "${{ steps.v.outputs.version }}" --notes notes.md --dry
      - run: gh release create "${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --notes-file notes.md
      - run: node scripts/discord-changelog.mjs --since "${{ steps.v.outputs.prev }}" --version "${{ steps.v.outputs.version }}"
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
