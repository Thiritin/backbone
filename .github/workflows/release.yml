name: Release

# A push to main that adds CHANGELOG.md bullets creates or updates that day's GitHub release (the date is the version,
# for example 2026.10.31) and posts the new bullets to the #changelog channel.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discord-changelog.mjs --since "${{ github.event.before }}"
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
