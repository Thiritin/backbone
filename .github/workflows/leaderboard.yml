name: Leaderboard

# A pull request that adds run files to leaderboard/ passes only when every run replays to the scores it claims.
# A push to main replays every run again and publishes public/leaderboard.json with the site.
on:
  pull_request:
    paths: ["leaderboard/**"]
  push:
    branches: [main]
    paths: ["leaderboard/**"]

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay the submitted runs
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE...HEAD" -- 'leaderboard/*.run.json')
          if [ -z "$files" ]; then echo "No run files changed."; exit 0; fi
          scripts/replay-runs.sh "$RUNNER_TEMP/verified" $files

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay every run
        run: |
          shopt -s nullglob
          KEEP_GOING=1 scripts/replay-runs.sh "$RUNNER_TEMP/verified" leaderboard/*.run.json
          npx tsx scripts/leaderboard.ts "$RUNNER_TEMP"/verified/*.json
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update leaderboard"
          git push
          # A push made with the workflow token starts no workflow, so the deploy is started by hand.
          gh workflow run pages.yml --ref main
