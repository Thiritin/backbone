[package]
name = "backbone"
# Replaced from the release tag at build time; see .github/workflows/desktop.yml.
version = "0.1.0"
edition = "2021"

[lib]
name = "backbone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
